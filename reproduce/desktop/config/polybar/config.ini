; Stream-friendly adaptation inspired by shell-ninja/i3-dotfiles.
[bar/stream]
width = 100%
height = 36
background = #0f1722
foreground = #d8e2ee
font-0 = JetBrains Mono:style=Medium:size=10;3
font-1 = DejaVu Sans:size=11;3
padding-left = 0
padding-right = 2
module-margin = 0
modules-left = settings apps files workspaces
modules-center = title
modules-right = filesystem pulseaudio network clock
fixed-center = true
line-size = 2
border-bottom-size = 1
border-color = #30455c
override-redirect = false
enable-ipc = true
cursor-click = pointer

[module/settings]
type = custom/text
format = <label>
label = "  "
label-foreground = #ebcb8b
label-background = #172433
click-left = xfce4-settings-manager

[module/apps]
type = custom/text
format = <label>
label = " 󰀻 Apps "
label-foreground = #88c0d0
label-background = #172433
click-left = rofi -show drun

[module/files]
type = custom/text
format = <label>
label = "  Files "
label-foreground = #a3be8c
label-background = #172433
click-left = @HOME@/.local/bin/open-files

[module/terminal]
type = custom/text
format = <label>
label = " 󰞷 Term "
label-foreground = #81a1c1
label-background = #172433
click-left = @HOME@/.local/bin/open-terminal

[module/browser]
type = custom/text
format = <label>
label = "  Web "
label-foreground = #b48ead
label-background = #172433
click-left = @HOME@/.local/bin/open-browser --new-window

[module/workspaces]
type = internal/i3
pin-workspaces = true
index-sort = true
format = <label-state>
label-focused = " %name% "
label-focused-foreground = #eceff4
label-focused-background = #2e435e
label-focused-underline = #88c0d0
label-unfocused = " %name% "
label-unfocused-foreground = #7e94ac
label-unfocused-background = #172433
label-urgent = " %name% "
label-urgent-background = #bf616a

[module/title]
type = internal/xwindow
label = "%title:0:32:...%"
label-empty = "Stream desktop"
label-foreground = #8fa1b5

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true
format-mounted = <label-mounted>
format-mounted-padding = 2
format-mounted-prefix = " "
format-mounted-prefix-foreground = #81a1c1
label-mounted = "%free%"
label-mounted-foreground = #eceff4

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 1
format-volume = <ramp-volume> <label-volume>
format-volume-padding = 2
label-volume = %percentage%%
label-volume-foreground = #eceff4
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = #88c0d0
format-muted = <label-muted>
format-muted-padding = 2
format-muted-prefix = "󰝟 "
format-muted-prefix-foreground = #bf616a
label-muted = "muted"
label-muted-foreground = #bf616a
click-right = pavucontrol

[module/network]
type = internal/network
interface-type = wired
interval = 2
format-connected = <label-connected>
format-connected-padding = 2
format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = #a3be8c
label-connected = "󰄝 %downspeed:7%"
label-connected-foreground = #eceff4
format-disconnected = <label-disconnected>
format-disconnected-padding = 2
format-disconnected-prefix = "󰈂 "
format-disconnected-prefix-foreground = #bf616a
label-disconnected = "offline"
label-disconnected-foreground = #bf616a
click-left = nm-connection-editor

[module/clock]
type = internal/date
interval = 5
format-padding = 2
date = "%H:%M"
date-alt = "%a %b %d  %H:%M"
format-prefix = "󰅐 "
format-prefix-foreground = #88c0d0
label = "%date%"
label-foreground = #eceff4

[settings]
screenchange-reload = true
pseudo-transparency = false
