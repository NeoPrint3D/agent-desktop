# Nginx reverse proxy for Voxl. Install as /etc/nginx/sites-available/voxl
# and enable it from sites-enabled. Adjust server_name and certificate paths per host.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/voxl.crt;
    ssl_certificate_key /etc/nginx/ssl/voxl.key;

    # Voxl is configured to stream uploads. Remove Nginx's default 1 MiB limit.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:6901;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        # Do not spool large request bodies to Nginx's temp directory before forwarding.
        proxy_request_buffering off;
    }
}
