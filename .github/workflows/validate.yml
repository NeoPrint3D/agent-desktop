name: Validate rebuild recipe
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-and-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install disposable test-runner prerequisites (not workstation provisioning)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends i3-wm xvfb xauth xterm dbus-x11 wmctrl
      - name: Offline recipe and regression tests
        run: python3 -B reproduce/check.py
      - name: Real isolated i3 layout and user-unit smoke test (no browser)
        run: python3 -B reproduce/smoke_desktop.py --run
      - name: Verify single-script offline plan
        run: ./setup.sh --headless
# This checks the recipe, not a fresh Kali install, Chrome policies or guest reboot.
# Run reproduce/audit_sources.py on Kali and the full setup in a disposable Kali VM
# as separate acceptance gates before tagging a tested release.
